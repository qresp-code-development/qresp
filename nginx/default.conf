# Rate limiting, scoped per kind of traffic.
#
# A single server-wide `limit_req` used to cover EVERYTHING at 90r/m with a
# burst of 60. One Next.js page load pulls dozens of /_next/static chunks at
# once, so an ordinary navigation (and the redirect back from Google) drained
# the burst and nginx answered 503 for the page and its assets. Static assets
# and page navigation are therefore no longer rate limited by that zone;
# limits now sit where they are actually worth having.
#
# rate is per client IP. Values are per MINUTE for readability.
limit_req_zone $binary_remote_addr zone=pages:10m       rate=1200r/m;  # 20/s
limit_req_zone $binary_remote_addr zone=api_general:10m rate=600r/m;   # 10/s
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_costly:10m  rate=20r/m;
# Related Research sits between the two: it is an anonymous READ that renders
# with the detail page (so it must survive ordinary browsing), but on a cache
# miss it reaches an external provider (so it must not ride the general API
# allowance). 1/s with a burst of 30 covers a browsing session comfortably and
# still bounds what one client can push outward.
limit_req_zone $binary_remote_addr zone=api_related:10m rate=60r/m;

# A throttled client is being told "slow down", not "the service is broken".
# 503 made a limiter indistinguishable from an outage in the logs.
limit_req_status 429;

# OAuth callbacks carry `code` and `state` (and Microsoft's `session_state`,
# `error`, `error_description`) in the query string, which the default
# `$request` logs verbatim. Log the path and drop the whole query for auth
# routes — nothing there is worth keeping, and the backend applies the same
# redaction to its own access log.
map $request_uri $safe_request_uri {
    default                              $request_uri;
    "~^(?<auth_path>/api/auth/[^?]*)\?"  "$auth_path?[redacted]";
}

log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $safe_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

# proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;
  server_tokens off;

  # Docker's embedded DNS — resolves container names at request time so nginx
  # starts cleanly even when backend/gui aren't yet in the network.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api_upstream http://backend:5000;
  set $gui_upstream http://gui:3000;

  gzip on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_types text/css application/javascript image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_cache_bypass $http_upgrade;

  # proxy_set_header Host $http_host;
  # proxy_set_header X-Real-IP $remote_addr;
  # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Maximum request body size. The manuscript importer
  # (POST /api/import/manuscript) caps RAW uploads at 10M in the backend, but
  # the frontend sends the file base64-encoded inside JSON, so a full-size
  # upload arrives here as ~13.4M (10M x 4/3 + envelope). 15M lets every
  # backend-legal upload through so the backend's own limits and safety
  # validation produce the clear error — not an nginx 413. Requests over the
  # 5M buffer below are spooled to a temp file by nginx (normal behavior).
  client_max_body_size 15M;
  client_body_buffer_size 5M;

  ssl_certificate "/etc/certs/nginx.crt";
  ssl_certificate_key "/etc/certs/nginx.key";

  access_log /var/log/nginx/access.log redacted;

  # --- Static assets: never rate limited -----------------------------------
  # Content-hashed build output and images. A page load requests many of
  # these at once; throttling them breaks the page, not an attacker.
  location ^~ /_next/ {
    proxy_pass $gui_upstream;
  }

  location ^~ /images/ {
    proxy_pass $gui_upstream;
  }

  location = /favicon.ico {
    proxy_pass $gui_upstream;
  }

  # --- API: limits scoped to what they protect -----------------------------
  # Polled by every page mount to render the header; cheap and session-only,
  # so it rides the general API allowance rather than the sign-in one.
  # (An exact-match location wins over the ^~ prefix below.)
  location = /api/auth/me {
    limit_req zone=api_general burst=120 nodelay;
    proxy_pass $api_upstream;
  }

  # Sign-in starts and provider callbacks. A real sign-in is a couple of
  # requests, so this stays tight without ever touching a normal login.
  location ^~ /api/auth/ {
    limit_req zone=api_auth burst=20 nodelay;
    proxy_pass $api_upstream;
  }

  # Expensive or externally-billed work: AI assist, RCC folder analysis,
  # manuscript/DOI import, publishing.
  location ^~ /api/assist/ {
    limit_req zone=api_costly burst=10 nodelay;
    proxy_pass $api_upstream;
  }

  location ^~ /api/curation/ {
    limit_req zone=api_costly burst=10 nodelay;
    proxy_pass $api_upstream;
  }

  location ^~ /api/import/ {
    limit_req zone=api_costly burst=10 nodelay;
    proxy_pass $api_upstream;
  }

  location = /api/publish {
    limit_req zone=api_costly burst=10 nodelay;
    proxy_pass $api_upstream;
  }

  # Related Research: the only public READ that can reach an external
  # provider on a cache miss. A regex location so it wins over the /api
  # prefix below without disturbing any other paper sub-resource.
  location ~ ^/api/paper/[^/]+/related$ {
    limit_req zone=api_related burst=30 nodelay;
    proxy_pass $api_upstream;
  }

  location /api {
    limit_req zone=api_general burst=120 nodelay;
    proxy_pass $api_upstream;
  }

  # --- Page navigation ------------------------------------------------------
  # Generous enough that browsing, signing in and returning from a provider
  # never trips it, tight enough to stop a flood.
  location / {
    limit_req zone=pages burst=200 nodelay;
    proxy_pass $gui_upstream;
  }
}
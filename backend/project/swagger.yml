      description: "Response count, average rating, the 1-5 distribution, and
        a tally of the reasons given with low ratings, over SIGNED-IN
        respondents only. Deliberately returns no comment text, no respondent
        key, no record id and no individual response: nothing here can be
        joined back to a person. Rows written while anonymous rating was
        allowed are excluded -- they were never one-per-reader, so averaging
        them in would carry that defect into the new figure."
      parameters:

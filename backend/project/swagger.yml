swagger: "2.0"
info:
  description: REST API of a Qresp server (explore, curate, publish, accounts)
  version: "3.0.0"
  title: Qresp API
consumes:
  - "application/json"
produces:
  - "application/json"

basePath: "/api"

# Paths supported by the server application
paths:
  /healthz:
    get:
      operationId: "project.api.healthz"
      tags:
        - "Service"
      summary: "Reports that the API process is serving requests"
      responses:
        200:
          description: API process is available
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - ok
  /search:
    get:
      operationId: "project.api.search"
      tags:
        - "Papers"
      summary: "Fetches all papers"
      description: "Read the list of papers"
      parameters:
        - in: query
          name: searchWord
          type: string
          required: false
          description: Filter paper results based on search word
        - in: query
          name: paperTitle
          type: string
          required: false
          description: Filter paper results based on paper title
        - in: query
          name: doi
          type: string
          required: false
          description: Filter paper results based on paper doi
        - in: query
          name: tags
          type: string
          required: false
          description: Filter paper results based on paper tags
        - in: query
          name: collectionList
          type: string
          required: false
          description: Filter paper results based on collection. Seperate by comma for multiple values
        - in: query
          name: authorsList
          type: string
          required: false
          description: Filter paper results based on authors. Seperate by comma for multiple values
        - in: query
          name: publicationList
          required: false
          type: string
          description: Filter paper results based on publication. Seperate by comma for multiple values
      responses:
        200:
          description: "Successful read papers list operation"
          schema:
            type: "array"
            items:
              properties:
                _Search__abstract:
                  type: "string"
                _Search__authors:
                  type: "string"
                _Search__collections:
                  type: "array"
                _Search__doi:
                  type: "string"
                _Search__downloadPath:
                  type: "string"
                _Search__fileServerPath:
                  type: "string"
                _Search__folderAbsolutePath:
                  type: "string"
                _Search__id":
                  type: "string"
                _Search__institution:
                  type: "string"
                  description: >-
                    Optional, record-level, entered by the curator. The
                    institution associated with this RECORD -- not an
                    assertion that every listed author belongs to it, and
                    never inferred from authors, collections, the server URL,
                    an email domain or a DOI. Empty string on a record
                    published before the field existed, and on one whose
                    curator left it blank; both are valid and neither needs a
                    migration.
                _Search__notebookFile:
                  type: "string"
                _Search__notebookPath:
                  type: "string"
                _Search__publication:
                  type: "string"
                _Search__serverPath:
                  type: "string"
                _Search__tags:
                  type: "array"
                _Search__title:
                  type: "string"
                _Search__year:
                  type: "integer"
  /collections:
    get:
      operationId: "project.api.collections"
      tags:
        - "Collections"
      summary: "Fetches all collections"
      description: "Fetches collections from all Papers"
      responses:
        200:
          description: "Successful read collections list operation"
          schema:
            type: "array"
            items:
              type: "string"
  /authors:
    get:
      operationId: "project.api.authors"
      tags:
        - "Authors"
      summary: "Fetches all authors"
      description: "Fetches authors from papers"
      responses:
        200:
          description: "Successful read authors list operation"
          schema:
            type: "array"
            items:
              type: "string"
  /publications:
    get:
      operationId: "project.api.publications"
      tags:
        - "Publications"
      summary: "Fetches all publications"
      description: "Fetches publications from all papers"
      responses:
        200:
          description: "Successful read paper publications operation"
          schema:
            type: "array"
            items:
              type: "string"
  /paper/{id}:
    get:
      operationId: "project.api.paper"
      tags:
        - "Paper details"
      summary: "Fetches details of paper given id"
      description: "Fetches paper details given id. Includes the optional
        record-level `institution` field -- the institution associated with
        this RECORD as typed by the curator, not an assertion that every
        listed author belongs to it, and never inferred from authors,
        collections, the server URL, an email domain or a DOI. It is an empty
        string on a record published before the field existed and on one whose
        curator left it blank; both are valid and neither needs a migration."
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: "Successful read paper details "
    put:
      operationId: "project.api.update_paper"
      tags:
        - "Paper details"
      summary: "Updates a record's metadata (record owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: paper
          description: Partial or full paper metadata; top-level fields are
            merged into the stored record. Server-owned fields (id,
            owner_email, version bookkeeping) are ignored if present.
          required: true
          schema:
            type: object
      responses:
        200:
          description: Record updated
        400:
          description: Payload failed model validation
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin can edit
        404:
          description: Paper with this id does not exist
    delete:
      operationId: "project.api.delete_paper"
      tags:
        - "Paper details"
      summary: "Permanently deletes a record (record owner or admin only)"
      description: "Cannot be undone. Use PUT /paper/{id}/active to hide a
        record reversibly instead."
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: Record deleted
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may delete it
        404:
          description: Paper with this id does not exist
  /workflow/{id}:
    get:
      operationId: "project.api.workflow"
      tags:
        - "Workflow details"
      summary: "Fetches workflow of paper given id"
      description: "Fetches workflow of paper given id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: "Successful read workflow details of paper"
  /paper/{id}/chart/{cid}:
    get:
      operationId: "project.api.chart"
      tags:
        - "Chart details"
      summary: "Fetches chart of paper given id of paper and chart"
      description: "Fetches chart of paper given id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: path
          name: cid
          type: string
          required: true
          description: Chart Id
      responses:
        200:
          description: "Successful read workflow details of paper"
  /dircont:
    post:
      operationId: "project.api.dircontents"
      tags:
        - "Data source contents"
      summary: Returns a list of files and folders inside the directory
      parameters:
        - in: body
          name: req
          description: Contents to get of link.
          schema:
            type: object
            required:
              - link
              - src
              - service
            properties:
              link:
                type: string
              src:
                type: string
              service:
                type: boolean
      responses:
        200:
          description: Contents returned
        500:
          description: Failure
  /preview/{id}:
    get:
      operationId: "project.api.getPreview"
      tags:
        - "Get metadata for the preview"
      summary: "Get the metadata for preview from the id"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Metadata paper ID
      responses:
        200:
          description: Metadata successfully returned
        400:
          description: Incorrect paper id, paper with this id does not exist in the database
        500:
          description: Internal server error
  /preview:
    post:
      operationId: "project.api.generatePreview"
      tags:
        - "Generate metadata link"
      summary: "Add data for previewing the metadata under curation"
      parameters:
        - in: body
          name: paper
          description: The metadata for which the preview is to be generated
          schema:
            type: object
      responses:
        200:
          description: Metadata successfully added and returned
        400:
          description: Incorrect paper object
        500:
          description: Internal server error
  /publish:
    post:
      operationId: "project.api.publish"
      tags:
        - "Generate Publish Link"
      summary: "Send an email to the curator with the link to publish the paper (authenticated users only; the session identity becomes the record owner)"
      parameters:
        - in: body
          name: paper
          description: The paper to be published
          schema:
            type: object
      responses:
        200:
          description: Published; returns the new record id
        400:
          description: Incorrect paper object
        401:
          description: Authentication is required to publish
        500:
          description: Internal server error
  /paper/{id}/active:
    put:
      operationId: "project.api.set_paper_active"
      tags:
        - "Paper details"
      summary: "Activate or deactivate (soft delete) a record (owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: Set active=false to hide the record from public
            discovery, active=true to restore it.
          schema:
            type: object
            required:
              - active
            properties:
              active:
                type: boolean
      responses:
        200:
          description: Record activation state updated
        400:
          description: active must be a boolean
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may change this
        404:
          description: Paper with this id does not exist
  /paper/{id}/editors:
    put:
      operationId: "project.api.set_paper_editors"
      tags:
        - "Paper details"
      summary: "Replaces the record's editor list (owner or admin only; editors are edit-only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: Full replacement editor list; emails are normalized
            lowercase and deduplicated.
          schema:
            type: object
            required:
              - editor_emails
            properties:
              editor_emails:
                type: array
                items:
                  type: string
      responses:
        200:
          description: Editor list updated
        400:
          description: editor_emails missing or contains an invalid email
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may manage editors
        404:
          description: Paper with this id does not exist
  /paper/{id}/visibility:
    put:
      operationId: "project.api.set_paper_visibility"
      tags:
        - "Paper details"
      summary: "Make a record private or public (owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: Set is_private=true to hide the record from public
            discovery and restrict reading to the owner, editors, admins and
            viewer_emails. viewer_emails / editor_emails, when given,
            replace those lists (an email in both is an editor).
          schema:
            type: object
            required:
              - is_private
            properties:
              is_private:
                type: boolean
              viewer_emails:
                type: array
                items:
                  type: string
              editor_emails:
                type: array
                items:
                  type: string
      responses:
        200:
          description: Record visibility updated
        400:
          description: is_private must be a boolean, or an invalid viewer email
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may change this
        404:
          description: Paper with this id does not exist
  /paper/{id}/viewers:
    put:
      operationId: "project.api.set_paper_viewers"
      tags:
        - "Paper details"
      summary: "Replaces the list of accounts a private record is shared with (owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: Full replacement viewer list; emails are normalized
            lowercase and deduplicated. Viewers get read-only access.
          schema:
            type: object
            required:
              - viewer_emails
            properties:
              viewer_emails:
                type: array
                items:
                  type: string
      responses:
        200:
          description: Viewer list updated
        400:
          description: viewer_emails missing or contains an invalid email
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may manage sharing
        404:
          description: Paper with this id does not exist
  /paper/{id}/raw:
    get:
      operationId: "project.api.raw_paper"
      tags:
        - "Paper details"
      summary: "Returns the stored record document for editing (owner or admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
      responses:
        200:
          description: Stored record document returned
        401:
          description: Authentication required
        403:
          description: Only the record owner or an admin may load this
        404:
          description: Paper with this id does not exist
  /account/papers:
    get:
      operationId: "project.api.account_papers"
      tags:
        - "Account"
      summary: "Lists records owned by the current session user"
      responses:
        200:
          description: Compact list of the user's records
        401:
          description: Authentication required
  /account/drafts:
    get:
      operationId: "project.api.account_drafts"
      tags:
        - "Account"
      summary: "Lists the current session user's curator drafts"
      responses:
        200:
          description: Compact list of the user's drafts (no state payloads)
        401:
          description: Authentication required
    post:
      operationId: "project.api.create_account_draft"
      tags:
        - "Account"
      summary: "Saves a new curator draft (state may be arbitrarily incomplete)"
      parameters:
        - in: body
          name: body
          required: true
          description: Draft payload; state is stored as-is, never
            publish-validated.
          schema:
            type: object
            properties:
              title:
                type: string
              state:
                type: object
      responses:
        200:
          description: Draft created; summary returned
        400:
          description: Invalid draft payload
        401:
          description: Authentication required
  /account/drafts/{id}:
    get:
      operationId: "project.api.account_draft"
      tags:
        - "Account"
      summary: "Returns one of the user's drafts including its full state"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Draft Id
      responses:
        200:
          description: Draft returned
        401:
          description: Authentication required
        404:
          description: No such draft for this user
    put:
      operationId: "project.api.update_account_draft"
      tags:
        - "Account"
      summary: "Updates one of the user's drafts (title and/or state)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Draft Id
        - in: body
          name: body
          required: true
          description: Fields to update; state is stored as-is.
          schema:
            type: object
            properties:
              title:
                type: string
              state:
                type: object
      responses:
        200:
          description: Draft updated; summary returned
        400:
          description: Invalid draft payload
        401:
          description: Authentication required
        404:
          description: No such draft for this user
    delete:
      operationId: "project.api.delete_account_draft"
      tags:
        - "Account"
      summary: "Deletes one of the user's drafts"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Draft Id
      responses:
        200:
          description: Draft deleted
        401:
          description: Authentication required
        404:
          description: No such draft for this user
  /account/favorites:
    get:
      operationId: "project.api.account_favorites"
      tags:
        - "Account"
      summary: "Lists papers favorited by the current session user"
      responses:
        200:
          description: List of favorited papers with basic metadata
        401:
          description: Authentication required
    post:
      operationId: "project.api.add_favorite"
      tags:
        - "Account"
      summary: "Favorites a paper (idempotent)"
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - paper_id
            properties:
              paper_id:
                type: string
              server_url:
                type: string
              title:
                type: string
              authors:
                type: string
              year:
                type: integer
      responses:
        200:
          description: Paper favorited
        400:
          description: paper_id is required
        401:
          description: Authentication required
  /account/favorites/{paper_id}:
    delete:
      operationId: "project.api.remove_favorite"
      tags:
        - "Account"
      summary: "Removes a paper from favorites"
      parameters:
        - in: path
          name: paper_id
          type: string
          required: true
          description: Paper Id to unfavorite
      responses:
        200:
          description: Paper unfavorited
        401:
          description: Authentication required
  /admin/papers:
    get:
      operationId: "project.api.admin_papers"
      tags:
        - "Admin"
      summary: "Lists ALL records — active, deactivated, ownerless — for admin management"
      responses:
        200:
          description: Compact list of every stored record
        401:
          description: Authentication required
        403:
          description: Only an admin may list all records
  /admin/ownerless-papers:
    get:
      operationId: "project.api.ownerless_papers"
      tags:
        - "Admin"
      summary: "Lists legacy records without a verified owner (admin only)"
      responses:
        200:
          description: Compact list of ownerless records
        401:
          description: Authentication required
        403:
          description: Only an admin may list ownerless records
  /paper/{id}/owner:
    put:
      operationId: "project.api.assign_paper_owner"
      tags:
        - "Admin"
      summary: "Assigns a verified owner to a record (admin only)"
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: body
          name: body
          required: true
          description: The owner to assign; set force=true to replace an
            existing owner.
          schema:
            type: object
            required:
              - owner_email
            properties:
              owner_email:
                type: string
              force:
                type: boolean
      responses:
        200:
          description: Owner assigned
        400:
          description: Invalid email address
        401:
          description: Authentication required
        403:
          description: Only an admin may assign owners
        404:
          description: Paper with this id does not exist
        409:
          description: Record already has a different owner (use force)
  /federation/servers:
    get:
      operationId: "project.federation.federation_servers"
      tags:
        - "Paper details"
      summary: "The Qresp servers this deployment federates with"
      description: "The single authoritative federation list: the same set
        `?server=` is checked against, published so the Explorer offers
        exactly the servers the backend will accept. Derived and read-only;
        every origin is still re-checked (HTTPS, literal address, DNS) before
        any request is made to it."
      responses:
        200:
          description: >-
            `servers` is a list of {qresp_server_url, isActive,
            qresp_maintainer_emails}, in the shape the federated registry has
            always used. `default_server` is an ADDITIVE field naming the
            origin the Explorer opens on when the visitor has not chosen one:
            always one of `servers`, or "" when this deployment federates with
            nobody. It is set by QRESP_DEFAULT_EXPLORER_SERVER and is refused
            (falling back to the first listed server) when that names an
            origin outside the allowlist -- naming a server here can pick
            among the federated ones, never add one.
  /paper/{id}/related:
    get:
      operationId: "project.related.related_research"
      tags:
        - "Paper details"
      summary: "Related Qresp records (strict-gated) and recommended external
        papers (re-ranked, not gated) for a record (read-only; public active
        records only)"
      description: "Two lists, two DIFFERENT policies -- do not read one
        contract onto the other. `internal` (Related Qresp Records) computes
        this server's own corpus against Qresp's strict evidence gate; a
        candidate that does not pass is never returned, and at most 3 are.
        `external` (Recommended External Papers) asks Semantic Scholar for up
        to 150 candidates once per cache miss and RE-RANKS every
        deduplicated one by the same deterministic score -- the evidence gate
        is still computed per candidate and carried as a diagnostic, but it
        is never used to remove one. The best 25 by score (provider order as
        the tie-break) are returned, all in this one response, so a
        candidate with weak or zero Qresp evidence can still appear, usually
        near the tail. Off unless QRESP_RELATED_RESEARCH_ENABLED is set, in
        which case both lists come back empty with status `disabled`.
        External results are cached separately from the Paper document and
        never written into it; a provider timeout, 404, 429 or malformed
        answer degrades the external section only. Nothing here modifies a
        record."
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: query
          name: server
          type: string
          required: false
          description: >-
            The Qresp server that holds the record, as on the detail page URL
            (e.g. https://paperstack.example.org). Omitted, or naming this
            server, the record and the corpus are read locally exactly as
            before. Naming a server in the federated registry, both are read
            from that server over HTTPS and scored against ITS corpus; the
            record is never copied into this server's database. Any other
            value is refused with 400 — no arbitrary URL is fetched, and there
            is no fallback to the local database.
      responses:
        200:
          description: >-
            Two independent lists with SEPARATE caps AND separate policies,
            neither ever padded. `internal` holds at most 3 Qresp records,
            every one of which PASSED Qresp's evidence gate. `external` holds
            at most 25 papers, RE-RANKED (not filtered) from up to 150
            provider candidates by that same deterministic score — a
            candidate that would have failed the evidence gate can still be
            among them, typically near the end of the list; the gate's
            verdict is not exposed on the result and must not be inferred
            from a result's mere presence. The UI shows external results five
            to a page over at most five pages, and paging is a slice of THIS
            response — it triggers no further request to this endpoint and no
            further request to Semantic Scholar. `external.pipeline` reports
            where the candidates went (`raw_candidates`, `valid_candidates`,
            `after_dedupe`, `scored_candidates`, `shown`), with
            `0 <= shown <= 25 <= scored_candidates` and, under the current
            policy, `scored_candidates == after_dedupe` always (nothing is
            removed between de-duplication and the display cap).
            `internal[].id` links to the Qresp detail page and
            `internal[].server` names the Qresp server it lives on (empty for
            this one); `external[].url` prefers an HTTPS DOI link.
            `source_server` echoes the server both lists were computed from.
            Every result carries grounded `reasons` (at most three) when Qresp
            found nameable evidence; an external result with no evidence
            carries none rather than an invented explanation. Each section
            reports a `status`: `ok`, `disabled`, `unavailable`, and for the
            external one also `unresolved` and `stale`, which is true when a
            refresh failed and the last successful results are being served.
        400:
          description: The requested Qresp server is not one this server federates with
        404:
          description: No such record, or the record is not publicly available
  /paper/{id}/related/feedback:
    post:
      operationId: "project.feedback.submit_feedback"
      tags:
        - "Paper details"
      summary: "Records the signed-in reader's 1-5 rating of the Related
        Research list for a record (authentication required; one rating per
        account)"
      description: "AUTHENTICATED ONLY. Ratings from readers without an
        account are not collected: keyed on anything a reader can reset, one
        opinion per reader is not true. Requires the signed
        external.feedback_context that GET /paper/{id}/related issues after it
        has resolved a public, active record and computed a NON-EMPTY external
        list -- so a rating cannot be filed against a record that does not
        exist, or a list that was empty. results_shown is taken from that
        token, never from this body; page_at_submit and pages_viewed are
        clamped to the page count the token attests, and pages_viewed is never
        less than page_at_submit. Verification is a local signature check:
        this endpoint makes no provider, peer or cache request. Stores the
        rating, optional reason codes (offered only for a 1 or a 2), an
        optional short comment, and those counts. The IP address, the
        User-Agent, any other request header, the reader's email or account id
        in readable form, the recommendation scores or Why-related reasons,
        and the recommended papers' titles and DOIs are NOT stored, and no
        third party is contacted. A second submission by the same account for
        the same record and source UPDATES the first. The respondent is keyed
        by an HMAC of the durable account identifier; that key is never
        returned by any endpoint, and nothing is stored at all if the
        deployment has no signing secret."
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: query
          name: server
          type: string
          required: false
          description: >-
            The Qresp server that holds the record, as on the detail page URL.
            Ratings are namespaced by server exactly as the recommendation
            cache is, so the same id on two servers never pools its ratings.
            A server outside the federated registry is refused with 400.
        - in: body
          name: body
          required: true
          description: The rating and its context. Counts only; nothing here
            identifies the reader.
          schema:
            type: object
            required:
              - rating
              - feedback_context
            properties:
              rating:
                type: integer
                minimum: 1
                maximum: 5
                description: 1 = Very dissatisfied, 3 = Neutral, 5 = Very satisfied
              feedback_context:
                type: string
                description: >-
                  The signed external.feedback_context from this record's GET
                  /paper/{id}/related response. Binds the record, the server,
                  the list, the real result count, the real page count and an
                  expiry. Carries no user identifier and no recommendation
                  detail.
              source:
                type: string
                enum: [external, internal]
                default: external
              reasons:
                type: array
                description: Optional, and only meaningful for a rating of 1
                  or 2. Any other value is refused rather than stored.
                items:
                  type: string
                  enum:
                    - too_many_unrelated
                    - not_my_research_area
                    - already_knew_these
                    - need_more_variety
                    - other
              comment:
                type: string
                maxLength: 1000
              page_at_submit:
                type: integer
                minimum: 1
                description: Clamped to the page count the token attests.
              pages_viewed:
                type: integer
                minimum: 1
                description: Clamped the same way, and never below
                  page_at_submit.
      responses:
        200:
          description: The rating was stored (or updated). Echoes back only
            this reader's own rating, reasons and comment.
        400:
          description: Rating out of range, unknown source or reason code,
            comment too long, a Qresp server this deployment does not federate
            with, or a feedback context that is missing, malformed, unsigned,
            for another record/server/list, or describes no results
        401:
          description: Authentication required
        403:
          description: CSRF token missing or invalid, or the account cannot be
            identified
        410:
          description: The feedback context has expired; reload the
            recommendations to obtain a fresh one
        503:
          description: The rating could not be stored, or this server has no
            signing secret configured
    get:
      operationId: "project.feedback.my_feedback"
      tags:
        - "Paper details"
      summary: "Reads back the signed-in reader's OWN rating for a record
        (authentication required)"
      description: "Exactly one person's answer -- theirs -- so the rating
        widget can show what they chose last time. Returns no other reader's
        rating, no respondent key, no aggregate and nothing about the
        recommendations themselves. A null rating means this reader has not
        rated this list, which is an answer rather than a 404."
      parameters:
        - in: path
          name: id
          type: string
          required: true
          description: Paper Id
        - in: query
          name: server
          type: string
          required: false
          description: The Qresp server that holds the record
        - in: query
          name: source
          type: string
          required: false
          enum: [external, internal]
          default: external
      responses:
        200:
          description: This reader's own rating, reasons and comment
        400:
          description: Unknown source, or a Qresp server this deployment does
            not federate with
        401:
          description: Authentication required
        403:
          description: The account cannot be identified
        503:
          description: Feedback could not be read, or this server has no
            signing secret configured
  /related/feedback/summary:
